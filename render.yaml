# One-click Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: twoseats
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Optional TURN relay (needed only if a direct connection can't be made,
      # e.g. strict mobile-carrier NAT). Fill these in the Render dashboard.
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
